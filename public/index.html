<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A Node.js and Express Task Manager created for the L00213552 CI/CD pipeline assignment."
  >
  <title>L00213552 Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <p class="project-label">DevOps in Action</p>
      <h1>L00213552 Task Manager</h1>
      <p>
        A Node.js and Express web application developed to demonstrate
        a complete CI/CD pipeline.
      </p>
    </header>

    <section class="task-panel" aria-labelledby="task-heading">
      <h2 id="task-heading">My Tasks</h2>

      <form id="task-form">
        <label for="task-title">New task</label>

        <div class="form-row">
          <input
            id="task-title"
            name="title"
            type="text"
            maxlength="100"
            placeholder="Enter a task"
            required
          >
          <button type="submit">Add Task</button>
        </div>

        <p id="form-message" class="message" aria-live="polite"></p>
      </form>

      <div class="task-summary">
        <span id="task-count">0 tasks</span>
        <span id="completed-count">0 completed</span>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <p id="empty-message" class="empty-message">
        No tasks have been added yet.
      </p>
    </section>

    <footer>
      <p>Student ID: L00213552 | Task 3 CI/CD Pipeline</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
